[tool.poetry]
name = "deepreview-backend"
version = "0.1.0"
description = "FastAPI service powering the DeepReview AI code review platform."
authors = ["DeepReview Team <hello@deepreview.app>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }
beanie = "^1.25.0"
motor = "^3.6.0"
pydantic = "^2.8.0"
pydantic-settings = "^2.3.2"
httpx = "^0.27.2"
celery = "^5.4.0"
redis = "^5.0.4"
slowapi = "^0.1.9"
tenacity = "^9.0.0"
structlog = "^24.1.0"
loguru = "^0.7.2"
python-json-logger = "^2.0.7"
async-timeout = "^4.0.3"
python-dateutil = "^2.9.0"
packaging = "^24.1"
passlib = { extras = ["bcrypt"], version = "^1.7.4" }
python-jose = "^3.3.0"
python-multipart = "^0.0.9"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.23.7"
pytest-cov = "^5.0.0"
httpx = "^0.27.2"
ruff = "^0.5.5"
black = "^24.8.0"
mypy = "^1.10.0"
pre-commit = "^3.7.1"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "B", "UP", "ASYNC" ]
ignore = ["E203", "W503"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-ra --maxfail=1 --strict-markers --strict-config"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
